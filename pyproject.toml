[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileorg"
version = "0.1.0"
description = "Automated file classification and organization based on document content and metadata"
requires-python = ">=3.10"
dependencies = ["pypdf>=4.0", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "faker>=24"]

[project.scripts]
fileorg = "fileorg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
